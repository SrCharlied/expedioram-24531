[package]
name = "expedition33_continente_inacabado"
version = "0.1.0"
edition = "2021"
# El paquete tiene dos binarios: el de ventana y el render headless.
# Sin esto, `cargo run` a secas se niega a elegir, y es el comando que
# verifica la Tarea 8.6 en un clon limpio.
default-run = "expedition33_continente_inacabado"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Ruta A de la Tarea 7.3, autorizada por el profesor y **encendida por
# defecto** desde la decision de entrega: los pilares del Rompeolas son
# prismas hexagonales en lo que se envia.
#
# La Ruta B no se descarta, se conserva como respaldo explicito:
#
#   cargo run  --release --no-default-features    # cuboides
#   cargo test --no-default-features
#
# Sigue siendo una feature y no codigo fijo porque las dos rutas tienen que
# poder compararse, y porque revertir la decision tiene que ser una bandera
# y no un parche.
[features]
default = ["hex-prism"]
hex-prism = []

[dependencies]
nalgebra-glm = "0.18.0"
minifb = "0.26.0"
image = { version = "0.25", default-features = false, features = ["png"] }

# El mismo crate como dev-dependency: los tests de integracion solo ven la
# API publica del paquete mas sus dev-dependencies, y necesitan decodificar
# el PNG que produce save_png para comprobar que es valido.
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 3
